name: Database backup to R2

# Nightly encrypted logical backup of the production database.
# Secrets required (none of them live in the repository):
#   SUPABASE_ACCESS_TOKEN  - Supabase CLI token (used by `supabase db dump`)
#   BACKUP_PASSPHRASE      - passphrase for AES-256 encryption
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY - R2 token scoped to this bucket only
#   R2_ENDPOINT            - https://<account-id>.r2.cloudflarestorage.com
#   R2_BUCKET              - aqarbooks-backups
# The dump is encrypted before it leaves the runner; nothing is stored in Git
# or in Actions artifacts.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for v in SUPABASE_ACCESS_TOKEN BACKUP_PASSPHRASE R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!v:-}" ]; then echo "missing secret: $v"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ataslxkcflxuilpgyepm
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          mkdir -p out
          supabase db dump --schema public -f out/public_schema.sql
          supabase db dump --data-only --schema public -f out/public_data.sql
          supabase db dump --schema auth -f out/auth_schema.sql
          supabase db dump --data-only --schema auth -f out/auth_data.sql
          supabase db dump --role-only -f out/roles.sql
          (cd out && sha256sum ./*.sql > SHA256SUMS.txt)

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          tar -czf - -C out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:BACKUP_PASSPHRASE -out "backup-$STAMP.tar.gz.enc"
          echo "BACKUP_FILE=backup-$STAMP.tar.gz.enc" >> "$GITHUB_ENV"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/daily/$BACKUP_FILE" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Verify round-trip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://$R2_BUCKET/daily/$BACKUP_FILE" check.enc --endpoint-url "$R2_ENDPOINT" --only-show-errors
          cmp "$BACKUP_FILE" check.enc
          mkdir -p verify
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in check.enc | tar -xzf - -C verify
          (cd verify && sha256sum -c SHA256SUMS.txt >/dev/null)
          rm -rf verify check.enc

      - name: Retention (30 days)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '30 days ago' +%Y%m%dT%H%M%SZ)"
          aws s3 ls "s3://$R2_BUCKET/daily/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | while read -r key; do
            [ -z "$key" ] && continue
            stamp="${key#backup-}"; stamp="${stamp%%Z*}"
            if [ -n "$stamp" ] && [ "$stamp" \< "$CUTOFF" ]; then
              aws s3 rm "s3://$R2_BUCKET/daily/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            fi
          done

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Nightly database backup failed"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$open" -eq 0 ]; then
            gh issue create --title "$title" --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
