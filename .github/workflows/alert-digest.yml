name: Daily alert digest

# Why a workflow and not a Cloudflare Cron Trigger: OpenNext generates the
# worker entry point, so adding a `scheduled` handler would mean maintaining
# generated output. A workflow that posts to the route is visible, retryable by
# hand, and leaves a log someone can read when a digest does not arrive.
#
# The route refuses to run unless CRON_SECRET is set, so a missing secret fails
# closed rather than exposing an endpoint that reads every tenant.

on:
  schedule:
    # 06:00 Africa/Cairo. GitHub schedules in UTC and does not observe DST, so
    # this is fixed at 04:00 UTC year-round rather than tracking local time.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: alert-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          # Not yet configured is a known, intended state right after this
          # shipped -- so it warns rather than failing. A daily red run for a
          # deliberate gap trains people to ignore the badge, which is exactly
          # what you do not want the day it goes red for a real reason.
          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::CRON_SECRET is not set; no digest was sent. Add it in repository secrets and as a Cloudflare secret."
            exit 0
          fi

          response=$(mktemp)
          code=$(curl -s -o "$response" -w '%{http_code}' -m 300 \
            -X POST "https://aqarbooks.com/api/cron/alert-digest" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Length: 0")

          echo "HTTP $code"
          cat "$response"
          echo

          # 503 means the deployment has no CRON_SECRET attached -- a real
          # misconfiguration, not a transient error, so it fails the run.
          if [ "$code" != "200" ]; then
            echo "Digest run did not complete cleanly."
            exit 1
          fi
