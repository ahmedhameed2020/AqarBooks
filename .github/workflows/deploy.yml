name: Deploy to Cloudflare

# Why this exists: production once served 404s for eight days because master
# was only ever deployed by hand and the last manual deploy predated commits
# 7236d57 / f98171c. Every merge to master now ships itself, and the smoke
# check below turns "deployed but broken" into a red badge instead of a
# user-reported bug.

on:
  workflow_dispatch:

# Never let two deploys race for the same worker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Pin npm to the major that generated package-lock.json. npm 10 refuses
      # this lock: @swc/core -- a transitive dependency of next-intl -- declares
      # @swc/helpers >=0.5.17 as a PEER dependency, so npm 10 tries to add
      # @swc/helpers@0.5.23, which the lock does not contain, and `npm ci` dies
      # with "can only install packages when your package.json and
      # package-lock.json are in sync". npm 11 resolves the same lock cleanly,
      # which is why it installs fine locally. Regenerating the lock on Windows
      # does not fix it -- npm there produces a byte-identical tree.
      - run: npm i -g npm@11

      - run: npm ci

      # Build-time environment.
      #
      # Next.js looks variables up in this order (repo docs,
      # node_modules/next/dist/docs/.../environment-variables.md):
      #   process.env > .env.<NODE_ENV>.local > .env.local > .env.<NODE_ENV> > .env
      # so an explicit `env:` here wins over every committed file, and a local
      # `.env.local` wins over `.env.production` when building on a machine.
      #
      # This repository tracks .env.production with the PUBLIC Supabase URL and
      # anon key (public by design; RLS enforces access). Two rules keep the
      # deploy honest:
      #   1. The expected production project ref MUST be declared in the
      #      `production` environment as PRODUCTION_SUPABASE_PROJECT_REF.
      #   2. The built bundle MUST inline exactly that project; otherwise the
      #      deploy stops before shipping.
      # 2026-11-01 incident: a local OpenNext build without explicit env inlined
      # the development project and every sign-in failed. The gate below exists
      # so that class of deploy cannot leave CI.
      #
      # SUPABASE_SERVICE_ROLE_KEY is deliberately ABSENT. If it were present at
      # build time, OpenNext would inline it into .open-next/cloudflare/
      # next-env.mjs and ship it inside the worker script in plaintext. It is an
      # encrypted Cloudflare secret read at request time instead.
      - name: Validate expected production project
        env:
          EXPECTED_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_REF:-}" ]; then
            echo "PRODUCTION_SUPABASE_PROJECT_REF is not declared in the production environment."
            echo "Refusing to build: without an explicit production project ref the bundle could point at another project."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_REF" | grep -Eq '^[a-z0-9]{16,}$'; then
            echo "PRODUCTION_SUPABASE_PROJECT_REF is not a plausible Supabase project ref."
            exit 1
          fi
          URL_HOST=$(grep -m1 '^NEXT_PUBLIC_SUPABASE_URL=' .env.production | cut -d= -f2- | tr -d '"' | sed -E 's|https?://||' | cut -d/ -f1)
          URL_REF=${URL_HOST%%.supabase.co}
          if [ "$URL_REF" != "$EXPECTED_REF" ]; then
            echo "The committed .env.production points at a different project than the declared production ref."
            echo "Committed: ${URL_REF}  Declared: ${EXPECTED_REF}"
            exit 1
          fi
          echo "expected production project: ${EXPECTED_REF} (public identifier)"
          echo "EXPECTED_SUPABASE_URL=https://${EXPECTED_REF}.supabase.co" >> "$GITHUB_ENV"

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Verify build env
        run: node scripts/verify-build-env.mjs "$EXPECTED_SUPABASE_URL"

      # --keep-vars stops the deploy from clearing runtime vars/bindings that
      # were set outside this config (including the secret above).
      - name: Deploy
        run: npx opennextjs-cloudflare deploy -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Guards the exact failure class that motivated this workflow: a deploy
      # that reports success while routes 404. Retries because edge
      # propagation is not instant.
      - name: Smoke check production routes
        run: |
          set -uo pipefail
          fail=0
          check() {
            path="$1"; want="$2"; code=""
            for _ in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://aqarbooks.com$path" || echo "000")
              [ "$code" = "$want" ] && { echo "OK    $path -> $code"; return 0; }
              sleep 6
            done
            echo "FAIL  $path -> $code (expected $want)"
            fail=1
          }
          # Public marketing + legal pages must render.
          check /en            200
          check /en/terms      200
          check /en/privacy    200
          # Onboarding must resolve and redirect anonymous visitors to login.
          # A 404 here means the route did not ship; a 200 would mean the auth
          # guard regressed.
          check /en/onboarding 307
          check /ar/onboarding 307
          # Auth guard on a protected route.
          check /en/dashboard  307
          exit $fail

# Deliberately NOT run here: npm run test:all. Those suites execute against the
# live production Supabase project and create real rows -- a leftover-org purge
# was already needed once. They must stay a manual, supervised step until they
# target a disposable database.
