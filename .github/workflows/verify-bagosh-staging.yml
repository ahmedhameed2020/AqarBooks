name: Verify Bagosh Staging

on:
  push:
    branches:
      - codex/bagosh-staging-deploy
  workflow_dispatch:

concurrency:
  group: verify-bagosh-staging
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm i -g npm@11
      - run: npm ci

      - name: TypeScript — full project
        run: npx tsc --noEmit

      - name: ESLint — financial integrity scope
        run: >-
          npx eslint
          'app/[locale]/(app)/finance/reports/fixed-assets/page.tsx'
          'app/[locale]/(app)/finance/reports/fixed-assets/fixed-assets-client.tsx'
          'app/[locale]/(app)/finance/reports/legacy-review/page.tsx'
          'app/[locale]/(app)/finance/reports/legacy-review/legacy-review-client.tsx'
          'app/[locale]/(app)/finance/reports/legacy-review/legacy-readiness-gate.tsx'
          'app/[locale]/(app)/finance/reports/legacy-review/legacy-master-data-findings.tsx'
          'app/[locale]/(app)/finance/reports/balance-sheet/page.tsx'
          'app/[locale]/(app)/finance/reports/balance-sheet/balance-sheet-client.tsx'
          'app/[locale]/(app)/property/[unitId]/tab-financials.tsx'
          'app/[locale]/(app)/property/[unitId]/legacy-historical-unit-accounts.tsx'

      - name: ESLint — full repository diagnostic
        continue-on-error: true
        run: npm run lint
