name: Verify Bagosh Staging

on:
  push:
    branches:
      - codex/bagosh-staging-deploy
  workflow_dispatch:

concurrency:
  group: verify-bagosh-staging
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm i -g npm@11
      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit
